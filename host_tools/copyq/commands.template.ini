[Command]
Name=Moonlander: Smart Title Case
Command="
    copyq:
    source('{{INSTALL_DIR}}/transformations.js');
    source('{{INSTALL_DIR}}/transaction.js');
    MoonlanderTransaction.runTransaction(
        MoonlanderTransforms.smartTitleCase,
        {},
        MoonlanderTransaction.createCopyQAdapter('{{RESELECT_HELPER}}')
    );"
GlobalShortcut=F13

[Command]
Name=Moonlander: Cycle Case
Command="
    copyq:
    source('{{INSTALL_DIR}}/transformations.js');
    source('{{INSTALL_DIR}}/transaction.js');
    MoonlanderTransaction.runTransaction(
        MoonlanderTransforms.cycleCase,
        {reselect: true},
        MoonlanderTransaction.createCopyQAdapter('{{RESELECT_HELPER}}')
    );"
GlobalShortcut=F19

